<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>go see doc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#ff6b6b; --teal:#2ec4b6; --gold:#ffd166; --violet:#a66bff;
    --sky:#4cc9f0; --lime:#8ac926; --pink:#ff8fab; --orange:#ff9f1c;
    --ink:#2b2d42; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; height:100%; overflow:hidden;}
  body{
    font-family:"Comic Sans MS","Chalkboard SE","Baloo 2",ui-rounded,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#bde0fe,#cdb4ff,#ffd6e8,#caffbf);
    background-size:400% 400%;
    animation:bgdrift 22s ease-in-out infinite;
    color:var(--ink);
    height:100vh; width:100vw;
    display:flex; align-items:center; justify-content:center;
  }
  @keyframes bgdrift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  #app{ width:min(96vw,640px); height:min(94vh,860px); position:relative; }
  .screen{
    position:absolute; inset:0;
    background:var(--card);
    border-radius:32px;
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    padding:clamp(14px,3vw,28px);
    display:none; flex-direction:column; align-items:center; justify-content:flex-start;
    opacity:0; transform:scale(.94);
    overflow:hidden;
  }
  .screen.active{ display:flex; animation:screenIn .35s ease forwards; }
  @keyframes screenIn{ to{ opacity:1; transform:scale(1); } }

  .home-btn{
    position:absolute; top:14px; left:14px; z-index:5;
    width:48px; height:48px; border-radius:50%; border:none;
    background:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.15); cursor:pointer;
  }
  .home-btn:active{ transform:scale(.9); }

  .art-badge{
    width:clamp(120px,32vw,190px); height:clamp(120px,32vw,190px);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(60px,16vw,100px);
    margin:6px auto 4px;
    animation:floatY 3.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));
  }
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .scene{ position:relative; width:100%; display:flex; justify-content:center; gap:4px; }
  .mini{ font-size:clamp(28px,7vw,46px); animation:floatY 3s ease-in-out infinite; }
  .mini.d2{ animation-delay:.4s; }
  .mini.d3{ animation-delay:.8s; }

  .big-btn{
    border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:700; letter-spacing:1px;
    color:#fff; font-size:clamp(22px,6vw,34px);
    padding:clamp(10px,2.6vh,18px) clamp(34px,8vw,64px);
    box-shadow:0 10px 0 rgba(0,0,0,.15), 0 14px 24px rgba(0,0,0,.18);
    transition:transform .08s ease, opacity .2s ease;
  }
  .big-btn:active{ transform:translateY(6px) scale(.98); box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .big-btn[disabled]{ opacity:.35; pointer-events:none; }
  .btn-go{ background:linear-gradient(180deg,#54e08b,#1fae63); }
  .btn-go.pulse{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  h1.title{ font-size:clamp(20px,5.5vw,30px); margin:2px 0 10px; text-align:center; }

  /* name screen */
  #nameStrip{
    display:flex; gap:6px; min-height:clamp(46px,10vh,68px);
    align-items:center; justify-content:center; flex-wrap:wrap;
    margin:6px 0 10px; width:100%;
  }
  .letterbox{
    width:clamp(34px,8vw,52px); height:clamp(40px,9vh,58px);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,5vw,30px); font-weight:800; color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.15);
    animation:popIn .32s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  .letterbox.leaving{ animation:popOut .18s ease forwards; }
  @keyframes popOut{ to{ transform:scale(0) rotate(20deg); opacity:0; } }
  .caretbox{
    width:clamp(34px,8vw,52px); height:clamp(40px,9vh,58px);
    border-radius:12px; border:3px dashed #d8d8e6;
  }

  #keyboard{ display:flex; flex-direction:column; gap:6px; align-items:center; width:100%; }
  .kbrow{ display:flex; gap:5px; justify-content:center; }
  .key{
    border:none; border-radius:10px; background:#eef1ff; color:var(--ink);
    font-family:inherit; font-weight:800; cursor:pointer;
    width:clamp(26px,7.6vw,42px); height:clamp(32px,7.6vh,46px);
    font-size:clamp(14px,3.6vw,19px);
    box-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .key:active, .key.active{ background:var(--sky); color:#fff; transform:translateY(2px); }
  .key.wide{ width:clamp(50px,13vw,74px); background:#ffd6d6; font-size:clamp(16px,4vw,20px); }

  /* choice grids */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; margin:8px 0; }
  .choice{
    border:none; border-radius:24px; cursor:pointer; padding:10px 6px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:#f4f6ff; box-shadow:0 6px 0 rgba(0,0,0,.08);
    transition:transform .12s ease, background .12s ease;
  }
  .choice .emo{ font-size:clamp(40px,9vw,58px); }
  .choice .lab{ font-weight:800; font-size:clamp(14px,3.4vw,18px); letter-spacing:1px; }
  .choice.selected{ background:#fff2b8; transform:scale(1.06); box-shadow:0 0 0 4px var(--gold), 0 8px 0 rgba(0,0,0,.08); }
  .choice:active{ transform:scale(.95); }

  .spacer{ flex:1; }

  /* ticket */
  #ticket{
    width:100%; border-radius:22px; background:repeating-linear-gradient(135deg,#fff,#fff 10px);
    border:3px dashed #ffb703; padding:14px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  #ticketName{ display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
  #ticketRow{ display:flex; gap:22px; align-items:center; justify-content:center; margin-top:4px; }
  #ticketRow .emo{ font-size:clamp(42px,10vw,60px); }
  .stamp{
    position:absolute; top:10%; right:6%; font-size:clamp(50px,13vw,80px);
    transform:rotate(-14deg); opacity:0; color:#2ec4b6;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));
  }
  .stamp.show{ animation:stampDown .5s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes stampDown{0%{transform:scale(3) rotate(-30deg);opacity:0}70%{transform:scale(.85) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:1}}

  /* particles & confetti (fixed, above everything) */
  .fxlayer{ position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
  .particle{
    position:absolute; left:0; top:0; border-radius:50%;
    animation:burstFly .6s ease-out forwards;
  }
  @keyframes burstFly{ to{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; } }
  .confetti{
    position:absolute; top:-5vh; border-radius:2px;
    animation-name:confettiFall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{ to{ transform:translateY(115vh) rotate(var(--rot)); opacity:.95; } }

  .btn-row{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .btn-blue{ background:linear-gradient(180deg,#5ab8ff,#2b7fe0); }

  /* patient list */
  #patientList{ display:flex; flex-direction:column; gap:12px; width:100%; overflow-y:auto; padding:6px 4px; }
  .patient{
    border:none; border-radius:22px; cursor:pointer; background:#f4f6ff;
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    box-shadow:0 6px 0 rgba(0,0,0,.08); font-family:inherit;
  }
  .patient:active{ transform:scale(.97); }
  .patient .emo{ font-size:clamp(34px,8vw,48px); }
  .pname{ display:flex; gap:4px; flex-wrap:wrap; }
  .pname .letterbox{ width:clamp(28px,6.5vw,40px); height:clamp(32px,7vh,44px); font-size:clamp(16px,4vw,24px); animation:none; }
  .empty{ font-size:clamp(60px,16vw,100px); margin-top:20px; opacity:.6; }

  /* treat + heal */
  .who{ display:flex; align-items:center; gap:10px; margin:44px 0 6px; }
  .who .emo{ font-size:clamp(40px,10vw,60px); }
  .heal-stage{ position:relative; width:clamp(160px,40vw,230px); height:clamp(160px,40vw,230px); margin:50px auto 10px;
    border-radius:50%; background:radial-gradient(circle,#e6fff4,#a8f0d2); display:flex; align-items:center; justify-content:center; }
  #healFace{ font-size:clamp(80px,20vw,120px); }
  #healFace.wobble{ animation:wobble .5s ease-in-out 2; }
  @keyframes wobble{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
  #healFace.happy{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1); }
  #healTool{ position:absolute; font-size:clamp(50px,12vw,72px); opacity:0; }
  #healTool.fly{ animation:toolFly 1s ease-in-out forwards; }
  @keyframes toolFly{
    0%{ transform:translate(0,160px) scale(.3) rotate(0); opacity:0; }
    30%{ opacity:1; }
    70%{ transform:translate(0,0) scale(1.3) rotate(360deg); opacity:1; }
    100%{ transform:translate(0,-20px) scale(0) rotate(540deg); opacity:0; }
  }
  .sparkle{ position:absolute; font-size:clamp(22px,5vw,32px); opacity:0; }
  .heal-stage.done .sparkle{ animation:sparkle 1.6s ease-out forwards; }
  @keyframes sparkle{ 0%{opacity:0; transform:scale(0)} 30%{opacity:1; transform:scale(1.3)} 100%{opacity:0; transform:translateY(-40px) scale(.8)} }
  #yayWord{ font-size:clamp(36px,10vw,60px); font-weight:800; color:#1fae63; opacity:0; }
  #yayWord.show{ animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards; opacity:1; }

  #treatGrid, #feelGrid{ display:flex; flex-wrap:wrap; justify-content:center; }
  #treatGrid .choice, #feelGrid .choice{ width:calc(50% - 7px); padding:12px 6px; }
  #treatGrid .emo, #feelGrid .emo{ font-size:clamp(48px,11vw,68px); }

  #timeGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; margin:8px 0; }
  #timeGrid .choice{ padding:8px 4px; }
  #timeGrid .emo{ font-size:clamp(36px,9vw,54px); }
  #timeGrid .lab{ font-size:clamp(18px,4.6vw,26px); }
  .ptime{ margin-left:auto; display:flex; align-items:center; gap:4px; font-weight:800; font-size:clamp(16px,4vw,22px); }
  .ptime .clk{ font-size:clamp(26px,6vw,36px); }

  @media (max-height:620px){
    .art-badge{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- WELCOME -->
  <section class="screen active" id="screen-welcome">
    <h1 class="title">go see doc</h1>
    <div class="scene">
      <span class="mini">🏥</span>
      <div class="art-badge" style="background:radial-gradient(circle,#d7fff1,#9ee7d4);">🩺</div>
      <span class="mini d3">🧸</span>
    </div>
    <div class="spacer"></div>
    <div class="btn-row">
      <button class="big-btn btn-go pulse" id="btnStart">book</button>
      <button class="big-btn btn-blue" id="btnGoList">go</button>
    </div>
    <div class="spacer"></div>
  </section>

  <!-- NAME -->
  <section class="screen" id="screen-name">
    <button class="home-btn" data-home>🏠</button>
    <div class="art-badge" style="background:radial-gradient(circle,#ffe8c2,#ffd089);">📛</div>
    <div id="nameStrip"></div>
    <div id="keyboard"></div>
    <div class="spacer"></div>
    <button class="big-btn btn-go" id="btnNameOk" disabled>ok</button>
  </section>

  <!-- FEEL -->
  <section class="screen" id="screen-feel">
    <button class="home-btn" data-home>🏠</button>
    <div class="art-badge" style="background:radial-gradient(circle,#ffe0ea,#ffb6c9);">🩹</div>
    <div class="grid" id="feelGrid">
      <button class="choice" data-val="😊" data-lab="yay"><span class="emo">😊</span></button>
      <button class="choice" data-val="🤒" data-lab="hot"><span class="emo">🤒</span></button>
      <button class="choice" data-val="🤕" data-lab="ow"><span class="emo">🤕</span></button>
      <button class="choice" data-val="😢" data-lab="sad"><span class="emo">😢</span></button>
      <button class="choice" data-val="😵‍💫" data-lab="dizzy"><span class="emo">😵‍💫</span></button>
    </div>
    <div class="spacer"></div>
    <button class="big-btn btn-go" id="btnFeelOk" disabled>ok</button>
  </section>

  <!-- TIME: pick an appointment time -->
  <section class="screen" id="screen-time">
    <button class="home-btn" data-home>🏠</button>
    <div class="grid" id="timeGrid"></div>
    <div class="spacer"></div>
    <button class="big-btn btn-go" id="btnTimeOk" disabled>book</button>
  </section>

  <!-- DONE -->
  <section class="screen" id="screen-done">
    <button class="home-btn" data-home>🏠</button>
    <span class="stamp" id="stamp">✅</span>
    <div class="art-badge" style="background:radial-gradient(circle,#fff3bf,#ffe066);">🎉</div>
    <div id="ticket">
      <div id="ticketName"></div>
      <div id="ticketRow"></div>
      <div class="mini" id="ticketTime" style="font-size:clamp(20px,5vw,28px);"></div>
    </div>
    <div class="spacer"></div>
    <button class="big-btn btn-blue" id="btnAgain">go</button>
  </section>

  <!-- LIST: booked patients -->
  <section class="screen" id="screen-list">
    <button class="home-btn" data-home>🏠</button>
    <div class="art-badge" style="background:radial-gradient(circle,#dcefff,#a9d4ff);">📋</div>
    <div id="patientList"></div>
  </section>

  <!-- TREAT: pick a treatment -->
  <section class="screen" id="screen-treat">
    <button class="home-btn" data-home>🏠</button>
    <div class="who"><div class="pname" id="treatName"></div><span class="emo" id="treatFeel"></span></div>
    <div class="grid" id="treatGrid"></div>
    <div class="spacer"></div>
    <button class="big-btn btn-blue" id="btnTreatGo" disabled>go</button>
  </section>

  <!-- WELL: treatment worked -->
  <section class="screen" id="screen-well">
    <button class="home-btn" data-home>🏠</button>
    <div class="heal-stage" id="healStage">
      <span id="healFace">🤒</span>
      <span id="healTool">💊</span>
      <span class="sparkle" style="top:4%;left:12%;">✨</span>
      <span class="sparkle" style="top:8%;right:8%;animation-delay:.2s;">⭐</span>
      <span class="sparkle" style="bottom:8%;left:6%;animation-delay:.35s;">💖</span>
      <span class="sparkle" style="bottom:4%;right:14%;animation-delay:.5s;">✨</span>
    </div>
    <div id="yayWord">yay</div>
    <div class="pname" id="wellName"></div>
    <div class="spacer"></div>
    <button class="big-btn btn-blue" id="btnWellGo">go</button>
  </section>

</div>

<div class="fxlayer" id="fx"></div>

<script>
(function(){
  "use strict";

  var COLORS = ["#ff6b6b","#2ec4b6","#ffd166","#a66bff","#4cc9f0","#8ac926","#ff8fab","#ff9f1c"];
  var NOTES = [261.6,293.7,329.6,392.0,440.0,523.3]; // pentatonic-ish, always sounds nice

  var state = { name:"", feel:null, feelLab:null, hour:null };

  // appointment times: on the hour, 9am to 5pm (24h hour -> clock emoji)
  var CLOCKS = { 9:"🕘", 10:"🕙", 11:"🕚", 12:"🕛", 13:"🕐", 14:"🕑", 15:"🕒", 16:"🕓", 17:"🕔" };
  function timeText(h){ return (h > 12 ? h - 12 : h) + ":00"; }

  // ---------- audio ----------
  var actx = null;
  function ac(){
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(actx.state === "suspended"){ actx.resume(); }
    return actx;
  }
  function tone(freq, dur, type){
    try{
      var c = ac();
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, c.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + dur + 0.02);
    }catch(e){}
  }
  function pingRandom(){ tone(NOTES[Math.floor(Math.random()*NOTES.length)], 0.28, "triangle"); }
  function popDown(){ tone(220, 0.14, "sine"); }
  function tapSound(){ tone(330, 0.12, "sine"); }
  function tune(){
    var seq = [523.3, 659.3, 784.0, 1046.5];
    seq.forEach(function(f, i){ setTimeout(function(){ tone(f, 0.3, "triangle"); }, i*160); });
  }

  // ---------- fx: bursts & confetti ----------
  var fx = document.getElementById("fx");
  function burst(x, y){
    for(var i=0;i<10;i++){
      var p = document.createElement("div");
      p.className = "particle";
      var size = 6 + Math.random()*8;
      var ang = Math.random()*Math.PI*2;
      var dist = 40 + Math.random()*50;
      p.style.width = size+"px"; p.style.height = size+"px";
      p.style.left = x+"px"; p.style.top = y+"px";
      p.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      p.style.setProperty("--dx", (Math.cos(ang)*dist)+"px");
      p.style.setProperty("--dy", (Math.sin(ang)*dist)+"px");
      fx.appendChild(p);
      setTimeout(function(el){ return function(){ el.remove(); }; }(p), 650);
    }
  }
  function confettiBurst(){
    for(var i=0;i<60;i++){
      var c = document.createElement("div");
      c.className = "confetti";
      var w = 6+Math.random()*8, h = 8+Math.random()*10;
      c.style.width = w+"px"; c.style.height = h+"px";
      c.style.left = (Math.random()*100)+"vw";
      c.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      c.style.setProperty("--rot", (Math.random()*720-360)+"deg");
      var dur = 1.8 + Math.random()*1.6;
      c.style.animationDuration = dur+"s";
      c.style.animationDelay = (Math.random()*0.4)+"s";
      fx.appendChild(c);
      setTimeout(function(el){ return function(){ el.remove(); }; }(c), (dur+0.6)*1000);
    }
  }

  // ---------- screen nav ----------
  var screens = {};
  ["welcome","name","feel","time","done","list","treat","well"].forEach(function(id){
    screens[id] = document.getElementById("screen-"+id);
  });
  function show(id){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k===id); });
  }

  document.querySelectorAll("[data-home]").forEach(function(btn){
    btn.addEventListener("click", function(){ tapSound(); resetAll(); });
  });

  // ---------- welcome ----------
  document.getElementById("btnStart").addEventListener("click", function(e){
    ac(); tone(392,0.2,"triangle");
    var r = e.target.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
    show("name");
  });

  // ---------- name screen ----------
  var nameStrip = document.getElementById("nameStrip");
  var btnNameOk = document.getElementById("btnNameOk");
  var MAXLEN = 10;

  function renderCaret(){
    // trailing dashed box hint, only if room left
    var existing = nameStrip.querySelector(".caretbox");
    if(existing) existing.remove();
    if(state.name.length < MAXLEN){
      var c = document.createElement("div");
      c.className = "caretbox";
      nameStrip.appendChild(c);
    }
  }

  function addLetter(ch){
    if(state.name.length >= MAXLEN) return;
    state.name += ch;
    var box = document.createElement("div");
    box.className = "letterbox";
    box.textContent = ch;
    box.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    box.style.transform = "rotate("+(Math.random()*14-7)+"deg)";
    var caret = nameStrip.querySelector(".caretbox");
    if(caret) nameStrip.insertBefore(box, caret); else nameStrip.appendChild(box);
    renderCaret();
    pingRandom();
    var r = box.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
    btnNameOk.disabled = state.name.length === 0;
  }
  function removeLetter(){
    if(state.name.length === 0) return;
    state.name = state.name.slice(0,-1);
    var boxes = nameStrip.querySelectorAll(".letterbox");
    var last = boxes[boxes.length-1];
    if(last){
      last.classList.add("leaving");
      setTimeout(function(){ last.remove(); }, 180);
    }
    popDown();
    btnNameOk.disabled = state.name.length === 0;
  }

  var ROWS = ["qwertyuiop","asdfghjkl","zxcvbnm"];
  var kb = document.getElementById("keyboard");
  ROWS.forEach(function(row, idx){
    var rowEl = document.createElement("div");
    rowEl.className = "kbrow";
    row.split("").forEach(function(ch){
      var b = document.createElement("button");
      b.className = "key";
      b.textContent = ch;
      b.id = "key-"+ch;
      b.addEventListener("click", function(){ addLetter(ch); });
      rowEl.appendChild(b);
    });
    if(idx === ROWS.length-1){
      var del = document.createElement("button");
      del.className = "key wide";
      del.textContent = "⌫";
      del.addEventListener("click", removeLetter);
      rowEl.appendChild(del);
    }
    kb.appendChild(rowEl);
  });
  renderCaret();

  document.addEventListener("keydown", function(e){
    if(!screens.name.classList.contains("active")) return;
    if(e.key === "Backspace"){ e.preventDefault(); removeLetter(); return; }
    if(e.key === "Enter"){ if(state.name.length>0){ goFeel(); } return; }
    if(/^[a-zA-Z]$/.test(e.key)){
      var low = e.key.toLowerCase();
      addLetter(low);
      var keyEl = document.getElementById("key-"+low);
      if(keyEl){
        keyEl.classList.add("active");
        setTimeout(function(){ keyEl.classList.remove("active"); }, 140);
      }
    }
  });

  function goFeel(){ tapSound(); show("feel"); }
  btnNameOk.addEventListener("click", goFeel);

  // ---------- feel screen ----------
  var btnFeelOk = document.getElementById("btnFeelOk");
  document.getElementById("feelGrid").addEventListener("click", function(e){
    var btn = e.target.closest(".choice");
    if(!btn) return;
    document.querySelectorAll("#feelGrid .choice").forEach(function(c){ c.classList.remove("selected"); });
    btn.classList.add("selected");
    state.feel = btn.dataset.val;
    state.feelLab = btn.dataset.lab;
    btnFeelOk.disabled = false;
    tapSound();
    var r = btn.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
  });
  btnFeelOk.addEventListener("click", function(){ tapSound(); show("time"); });

  // ---------- time screen ----------
  var timeGrid = document.getElementById("timeGrid");
  var btnTimeOk = document.getElementById("btnTimeOk");
  Object.keys(CLOCKS).forEach(function(h){
    var btn = document.createElement("button");
    btn.className = "choice";
    btn.dataset.val = h;
    btn.innerHTML = '<span class="emo">'+CLOCKS[h]+'</span><span class="lab">'+timeText(+h)+'</span>';
    timeGrid.appendChild(btn);
  });
  timeGrid.addEventListener("click", function(e){
    var btn = e.target.closest(".choice");
    if(!btn) return;
    timeGrid.querySelectorAll(".choice").forEach(function(c){ c.classList.remove("selected"); });
    btn.classList.add("selected");
    state.hour = +btn.dataset.val;
    btnTimeOk.disabled = false;
    tone(NOTES[(state.hour - 9) % NOTES.length], 0.25, "triangle");
    var r = btn.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
  });
  btnTimeOk.addEventListener("click", finish);

  // ---------- done screen ----------
  var ticketName = document.getElementById("ticketName");
  var ticketRow = document.getElementById("ticketRow");
  var stamp = document.getElementById("stamp");

  function finish(){
    bookings.push({ name: state.name || "hi", feel: state.feel || "😊", lab: state.feelLab || "yay", hour: state.hour || 9 });
    bookings.sort(function(a, b){ return (a.hour || 99) - (b.hour || 99); });
    saveBookings();
    show("done");
    confettiBurst();
    tune();

    ticketName.innerHTML = "";
    var letters = (state.name || "HI").split("");
    letters.forEach(function(ch){
      var box = document.createElement("div");
      box.className = "letterbox";
      box.textContent = ch;
      box.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
      ticketName.appendChild(box);
    });

    ticketRow.innerHTML =
      '<span class="emo">'+(state.feel||"😊")+'</span>';
    var h = state.hour || 9;
    document.getElementById("ticketTime").textContent = CLOCKS[h] + " " + timeText(h);

    stamp.classList.remove("show");
    void stamp.offsetWidth; // restart animation
    setTimeout(function(){ stamp.classList.add("show"); tone(180,0.18,"sine"); }, 350);
  }

  document.getElementById("btnAgain").addEventListener("click", function(){ tapSound(); resetAll(); showList(); });

  // ---------- bookings (saved in this browser) ----------
  var STORE = "goSeeDoc.bookings";
  var bookings;
  try{ bookings = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(!Array.isArray(bookings)){
    bookings = [
      { name:"mum", feel:"🤒", lab:"hot", hour:10 },
      { name:"dad", feel:"🤕", lab:"ow", hour:14 }
    ];
  }
  function saveBookings(){
    try{ localStorage.setItem(STORE, JSON.stringify(bookings)); }catch(e){}
  }

  var TREATMENTS = {
    hot: ["💊","💉","🧊","🥤","🛏️"],
    ow:  ["🩹","💉","🧊","💊","🩼"],
    sad: ["🤗","💉","🧸","🎈","💤"],
    yay: ["💉","🍎","🏃","💤"],
    dizzy: ["🥤","🛏️","💊","💉","🍎"]
  };

  function nameBoxes(el, name){
    el.innerHTML = "";
    name.split("").forEach(function(ch, i){
      var box = document.createElement("div");
      box.className = "letterbox";
      box.textContent = ch;
      box.style.background = COLORS[i % COLORS.length];
      el.appendChild(box);
    });
  }

  // ---------- list screen ----------
  var patientList = document.getElementById("patientList");
  var current = null;   // index of patient being treated
  var chosenTool = null;

  function showList(){
    patientList.innerHTML = "";
    if(bookings.length === 0){
      patientList.innerHTML = '<div class="empty" style="text-align:center;">🪑</div>';
    }
    bookings.forEach(function(b, i){
      var btn = document.createElement("button");
      btn.className = "patient";
      var nm = document.createElement("div");
      nm.className = "pname";
      nameBoxes(nm, b.name);
      var emo = document.createElement("span");
      emo.className = "emo";
      emo.textContent = b.feel;
      btn.appendChild(emo);
      btn.appendChild(nm);
      if(CLOCKS[b.hour]){
        var tm = document.createElement("span");
        tm.className = "ptime";
        tm.innerHTML = '<span class="clk">'+CLOCKS[b.hour]+'</span>'+timeText(b.hour);
        btn.appendChild(tm);
      }
      btn.addEventListener("click", function(){ tapSound(); openTreat(i); });
      patientList.appendChild(btn);
    });
    show("list");
  }

  document.getElementById("btnGoList").addEventListener("click", function(e){
    ac(); tone(440,0.2,"triangle");
    var r = e.target.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
    showList();
  });

  // ---------- treat screen ----------
  var treatGrid = document.getElementById("treatGrid");
  var btnTreatGo = document.getElementById("btnTreatGo");

  function openTreat(i){
    current = i;
    chosenTool = null;
    var b = bookings[i];
    nameBoxes(document.getElementById("treatName"), b.name);
    document.getElementById("treatFeel").textContent = b.feel;
    treatGrid.innerHTML = "";
    (TREATMENTS[b.lab] || TREATMENTS.hot).forEach(function(t){
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.dataset.val = t;
      btn.innerHTML = '<span class="emo">'+t+'</span>';
      treatGrid.appendChild(btn);
    });
    btnTreatGo.disabled = true;
    show("treat");
  }

  treatGrid.addEventListener("click", function(e){
    var btn = e.target.closest(".choice");
    if(!btn) return;
    treatGrid.querySelectorAll(".choice").forEach(function(c){ c.classList.remove("selected"); });
    btn.classList.add("selected");
    chosenTool = btn.dataset.val;
    btnTreatGo.disabled = false;
    tapSound();
    var r = btn.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2);
  });

  // ---------- well screen: the treatment works ----------
  var healFace = document.getElementById("healFace");
  var healTool = document.getElementById("healTool");
  var healStage = document.getElementById("healStage");
  var yayWord = document.getElementById("yayWord");
  var healTimers = [];

  btnTreatGo.addEventListener("click", function(){
    var b = bookings[current];
    healTimers.forEach(clearTimeout); healTimers = [];
    healFace.textContent = b.feel;
    healFace.className = "wobble";
    healTool.textContent = chosenTool;
    healTool.className = "";
    healStage.classList.remove("done");
    yayWord.classList.remove("show");
    nameBoxes(document.getElementById("wellName"), b.name);
    show("well");
    tone(300,0.15,"sine");

    healTimers.push(setTimeout(function(){
      void healTool.offsetWidth;
      healTool.className = "fly";
      tone(520,0.4,"sine");
    }, 600));
    healTimers.push(setTimeout(function(){
      healFace.textContent = "😊";
      healFace.className = "happy";
      healStage.classList.add("done");
      yayWord.classList.add("show");
      tune();
      confettiBurst();
      var r = healStage.getBoundingClientRect();
      burst(r.left+r.width/2, r.top+r.height/2);
    }, 1500));

    // all better: they go home, off the list
    bookings.splice(current, 1);
    saveBookings();
  });

  document.getElementById("btnWellGo").addEventListener("click", function(){ tapSound(); resetAll(); });

  // ---------- reset ----------
  function resetAll(){
    state = { name:"", feel:null, feelLab:null, hour:null };
    nameStrip.innerHTML = ""; renderCaret();
    btnNameOk.disabled = true;
    document.querySelectorAll(".choice").forEach(function(c){ c.classList.remove("selected"); });
    btnFeelOk.disabled = true;
    btnTimeOk.disabled = true;
    show("welcome");
  }

})();
</script>
</body>
</html>
